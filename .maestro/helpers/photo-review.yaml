appId: com.local.doctorrecords
---
- scrollUntilVisible:
    element:
      id: "view-original"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "view-original"
- extendedWaitUntil:
    visible:
      id: "source-image-0"
    timeout: 30000
- takeScreenshot: photo-original
- tapOn: "返回报告"
- scrollUntilVisible:
    element:
      id: "source-toggle-(-1|0)"
    direction: UP
    timeout: 60000
- tapOn:
    id: "source-toggle-(-1|0)"
- extendedWaitUntil:
    visible:
      id: "source-image-(-1|0)"
    timeout: 30000
- takeScreenshot: photo-source
- tapOn:
    id: "close-source-preview"
- scrollUntilVisible:
    element:
      id: "save-draft"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "save-draft"
- scrollUntilVisible:
    element:
      text: "‹ 返回"
    direction: UP
    timeout: 60000
- tapOn: "‹ 返回"
- assertVisible:
    id: "import-image"
